<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .visitors-table {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .table-header {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        
        .visitor-row {
            display: grid;
            grid-template-columns: 1fr 150px 100px 120px 80px;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            align-items: center;
        }
        
        .visitor-row:last-child {
            border-bottom: none;
        }
        
        .visitor-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .visitor-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .page-badge {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
        }
        
        .time-badge {
            background: #f3e5f5;
            color: #7b1fa2;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        
        .location-text {
            color: #666;
            font-size: 0.9em;
        }
        
        .online-indicator {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .events-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .event-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .event-icon {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .click-icon {
            background: #e8f5e8;
            color: #2e7d32;
        }
        
        .scroll-icon {
            background: #fff3e0;
            color: #f57c00;
        }
        
        .form-icon {
            background: #fce4ec;
            color: #c2185b;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin-top: 20px;
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Climate Seal 网站分析</h1>
            <p>实时访客数据 | 最后更新: <span id="lastUpdate"></span></p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalVisitors">0</div>
                <div class="stat-label">今日访客</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">0</div>
                <div class="stat-label">在线用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pageViews">0</div>
                <div class="stat-label">页面浏览</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgTime">0s</div>
                <div class="stat-label">平均停留</div>
            </div>
        </div>
        
        <div class="visitors-table">
            <div class="table-header">实时访客</div>
            <div class="visitor-row">
                <div style="font-weight: bold; color: #666;">访客信息</div>
                <div style="font-weight: bold; color: #666;">位置</div>
                <div style="font-weight: bold; color: #666;">页面</div>
                <div style="font-weight: bold; color: #666;">停留时间</div>
                <div style="font-weight: bold; color: #666;">状态</div>
            </div>
            <div id="visitorsContainer">
                <!-- 访客数据将在这里动态生成 -->
            </div>
        </div>
        
        <div class="events-section">
            <div class="table-header">用户行为事件</div>
            <div id="eventsContainer">
                <!-- 事件数据将在这里显示 -->
            </div>
            <button class="refresh-btn" onclick="refreshData()">刷新数据</button>
        </div>
    </div>

    <script>
        // 模拟的访客数据
        const mockVisitors = [
            { id: 1, country: '中国', city: '北京', page: '首页', time: '2m 30s', online: true },
            { id: 2, country: '美国', city: '纽约', page: '价格', time: '1m 45s', online: true },
            { id: 3, country: '德国', city: '柏林', page: '联系', time: '3m 12s', online: false },
            { id: 4, country: '日本', city: '东京', page: '关于', time: '56s', online: true },
            { id: 5, country: '英国', city: '伦敦', page: '首页', time: '4m 23s', online: true }
        ];

        const mockEvents = [
            { type: 'click', desc: '点击"联系我们"按钮', time: '2分钟前', icon: '👆' },
            { type: 'scroll', desc: '滚动到定价部分', time: '3分钟前', icon: '📜' },
            { type: 'form', desc: '提交联系表单', time: '5分钟前', icon: '📝' },
            { type: 'click', desc: '点击"Try Now"按钮', time: '7分钟前', icon: '👆' },
            { type: 'scroll', desc: '浏览产品特性', time: '8分钟前', icon: '📜' }
        ];

        function updateStats() {
            document.getElementById('totalVisitors').textContent = Math.floor(Math.random() * 50) + 20;
            document.getElementById('activeUsers').textContent = Math.floor(Math.random() * 8) + 2;
            document.getElementById('pageViews').textContent = Math.floor(Math.random() * 150) + 50;
            document.getElementById('avgTime').textContent = Math.floor(Math.random() * 180) + 60 + 's';
        }

        function renderVisitors() {
            const container = document.getElementById('visitorsContainer');
            container.innerHTML = mockVisitors.map(visitor => `
                <div class="visitor-row">
                    <div class="visitor-info">
                        <div class="visitor-avatar">${visitor.country.charAt(0)}</div>
                        <div>访客 #${visitor.id}</div>
                    </div>
                    <div class="location-text">${visitor.city}, ${visitor.country}</div>
                    <div class="page-badge">${visitor.page}</div>
                    <div class="time-badge">${visitor.time}</div>
                    <div>${visitor.online ? '<div class="online-indicator"></div>' : '离线'}</div>
                </div>
            `).join('');
        }

        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = mockEvents.map(event => `
                <div class="event-item">
                    <div class="event-icon ${event.type}-icon">${event.icon}</div>
                    <div>
                        <div style="font-weight: 500;">${event.desc}</div>
                        <div style="font-size: 0.8em; color: #666;">${event.time}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateTime() {
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-CN');
        }

        function refreshData() {
            updateStats();
            updateTime();
            
            // 模拟数据变化
            mockVisitors.forEach(visitor => {
                if (Math.random() > 0.7) {
                    const times = ['1m 12s', '2m 45s', '3m 30s', '45s', '5m 20s'];
                    visitor.time = times[Math.floor(Math.random() * times.length)];
                }
            });
            
            renderVisitors();
            renderEvents();
        }

        // 初始化
        updateStats();
        renderVisitors();
        renderEvents();
        updateTime();

        // 每30秒自动刷新
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
