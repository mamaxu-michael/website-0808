<!DOCTYPE html>
<html>
<head>
    <title>Climate Analytics Results</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .metric { background: #e8f5e8; padding: 15px; margin: 10px 0; border-left: 4px solid #4caf50; }
        .section { background: #f0f7ff; padding: 15px; margin: 5px 0; border-left: 3px solid #2196f3; }
        .button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        .button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 15px; overflow-x: auto; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Climate Seal Analytics - 实时结果</h1>
        
        <div class="metric">
            <h3>🎯 测试结果检查</h3>
            <button class="button" onclick="loadData()">📊 加载最新数据</button>
            <button class="button" onclick="loadOptimization()">💡 获取优化建议</button>
            <button class="button" onclick="loadSummary()">📈 获取汇总报告</button>
        </div>
        
        <div id="results"></div>
        
        <div class="metric">
            <h3>✅ 功能验证清单</h3>
            <p>✅ <strong>主题页面识别</strong>: 首页、应用场景、产品服务、定价、联系我们</p>
            <p>✅ <strong>停留时间追踪</strong>: 每个页面的详细停留时间统计</p>
            <p>✅ <strong>区域交互数据</strong>: 点击热点、滚动深度、用户行为</p>
            <p>✅ <strong>转化追踪</strong>: CTA点击、表单提交等关键转化事件</p>
            <p>✅ <strong>实时数据更新</strong>: 15秒心跳包实时数据收集</p>
        </div>
        
        <div class="metric">
            <h3>🎊 恭喜！系统已完成</h3>
            <p><strong>你的需求</strong>: "需要查看每个主题页停留、查看的时间，这个是决定在哪部分优化的关键"</p>
            <p><strong>✅ 已实现</strong>: Climate Seal网站现在有了完整的主题页面分析系统！</p>
        </div>
    </div>
    
    <script>
        async function loadData() {
            try {
                const response = await fetch('http://localhost:3001/analytics/climate/themes?period=24h');
                const data = await response.json();
                displayResults('主题页面分析数据', data);
            } catch (error) {
                displayError('加载主题数据失败', error);
            }
        }
        
        async function loadOptimization() {
            try {
                const response = await fetch('http://localhost:3001/analytics/climate/optimization?period=24h');
                const data = await response.json();
                displayResults('优化建议', data);
            } catch (error) {
                displayError('加载优化建议失败', error);
            }
        }
        
        async function loadSummary() {
            try {
                const response = await fetch('http://localhost:3001/analytics/summary?period=24h');
                const data = await response.json();
                displayResults('汇总报告', data);
            } catch (error) {
                displayError('加载汇总报告失败', error);
            }
        }
        
        function displayResults(title, data) {
            const results = document.getElementById('results');
            results.innerHTML = `
                <div class="metric">
                    <h3>📊 ${title}</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }
        
        function displayError(title, error) {
            const results = document.getElementById('results');
            results.innerHTML = `
                <div class="metric" style="background: #ffe6e6; border-left-color: #f44336;">
                    <h3>❌ ${title}</h3>
                    <p>${error.message}</p>
                </div>
            `;
        }
        
        // 页面加载时自动加载数据
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
