<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Seal 访客统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 1.1em;
        }
        
        .visitors { color: #4CAF50; }
        .views { color: #2196F3; }
        .new-visitors { color: #FF9800; }
        .returning { color: #9C27B0; }
        
        .data-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .country-item, .city-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .country-item:last-child, .city-item:last-child {
            border-bottom: none;
        }
        
        .country-name, .city-name {
            font-weight: 500;
        }
        
        .country-stats, .city-stats {
            color: #666;
            font-size: 0.9em;
        }
        
        .flag {
            font-size: 1.2em;
            margin-right: 8px;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .period-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .period-btn.active, .period-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .refresh-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-left: 20px;
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .timestamp {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Climate Seal 访客统计</h1>
            <p>实时监控网站访问情况和访客地理分布</p>
        </div>
        
        <div class="controls">
            <button class="period-btn active" data-period="1h">1小时</button>
            <button class="period-btn" data-period="24h">24小时</button>
            <button class="period-btn" data-period="7d">7天</button>
            <button class="period-btn" data-period="30d">30天</button>
            <button class="refresh-btn" onclick="loadStats()">🔄 刷新数据</button>
        </div>
        
        <div id="loading" class="loading">
            <h2>📊 加载数据中...</h2>
        </div>
        
        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value visitors" id="totalVisitors">0</div>
                    <div class="stat-label">独立访客</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value views" id="totalViews">0</div>
                    <div class="stat-label">页面浏览量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value new-visitors" id="newVisitors">0</div>
                    <div class="stat-label">新访客</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value returning" id="returnVisitors">0</div>
                    <div class="stat-label">回访者</div>
                </div>
            </div>
            
            <div class="data-section">
                <h2 class="section-title">🌍 访客国家分布</h2>
                <div id="countries"></div>
            </div>
            
            <div class="data-section">
                <h2 class="section-title">🏙️ 热门城市</h2>
                <div id="cities"></div>
            </div>
            
            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>
    
    <script>
        let currentPeriod = '1h';
        
        // 国家代码到flag emoji的映射
        const countryFlags = {
            'CN': '🇨🇳', 'US': '🇺🇸', 'GB': '🇬🇧', 'JP': '🇯🇵', 'DE': '🇩🇪', 
            'FR': '🇫🇷', 'KR': '🇰🇷', 'CA': '🇨🇦', 'AU': '🇦🇺', 'IT': '🇮🇹',
            'ES': '🇪🇸', 'NL': '🇳🇱', 'BR': '🇧🇷', 'IN': '🇮🇳', 'RU': '🇷🇺'
        };
        
        function getFlag(countryCode) {
            return countryFlags[countryCode] || '🌍';
        }
        
        async function loadStats() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            
            try {
                const response = await fetch(`http://localhost:3002/stats?period=${currentPeriod}`);
                const data = await response.json();
                
                // 更新汇总数据
                document.getElementById('totalVisitors').textContent = data.summary.totalVisitors || 0;
                document.getElementById('totalViews').textContent = data.summary.totalViews || 0;
                document.getElementById('newVisitors').textContent = data.summary.newVisitors || 0;
                document.getElementById('returnVisitors').textContent = data.summary.returnVisitors || 0;
                
                // 更新国家数据
                const countriesHtml = data.countries.map(country => `
                    <div class="country-item">
                        <div>
                            <span class="flag">${getFlag(country.country_code)}</span>
                            <span class="country-name">${country.country}</span>
                        </div>
                        <div class="country-stats">
                            ${country.visits} 次访问 | ${country.unique_visitors} 独立访客
                        </div>
                    </div>
                `).join('');
                document.getElementById('countries').innerHTML = countriesHtml || '<p>暂无数据</p>';
                
                // 更新城市数据
                const citiesHtml = data.topCities.map(city => `
                    <div class="city-item">
                        <div class="city-name">${city.city}, ${city.region}, ${city.country}</div>
                        <div class="city-stats">${city.visits} 次访问</div>
                    </div>
                `).join('');
                document.getElementById('cities').innerHTML = citiesHtml || '<p>暂无数据</p>';
                
                // 更新时间戳
                document.getElementById('timestamp').textContent = 
                    `最后更新: ${new Date(data.generatedAt).toLocaleString('zh-CN')}`;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('loading').innerHTML = 
                    '<h2>❌ 加载失败</h2><p>请检查服务器连接</p>';
            }
        }
        
        // 时间段选择
        document.querySelectorAll('.period-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPeriod = btn.dataset.period;
                loadStats();
            });
        });
        
        // 初始加载
        loadStats();
        
        // 自动刷新（每30秒）
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
