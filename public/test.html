<!DOCTYPE html>
<html>
<head>
    <title>Analytics Quick Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .link { display: block; margin: 10px 0; padding: 10px; background: #f0f0f0; text-decoration: none; color: #333; }
        .link:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <h1>🧪 Climate Analytics Test Links</h1>
    <a href="/debug-analytics.html" class="link">📱 调试页面 - Debug Analytics</a>
    <a href="/analytics-dashboard.html" class="link">📊 分析仪表板 - Analytics Dashboard</a>
    <a href="/" class="link">🏠 主网站 - Main Website</a>
    
    <div style="margin-top: 30px; padding: 20px; background: #e8f5e8;">
        <h3>📊 快速数据查看</h3>
        <button onclick="checkData()">检查最新数据</button>
        <div id="result" style="margin-top: 10px; font-family: monospace;"></div>
    </div>
    
    <script>
        async function checkData() {
            try {
                const response = await fetch('http://localhost:3001/analytics/climate/themes?period=1h');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    '<h4>最新分析数据:</h4>' +
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '❌ 数据获取失败: ' + error.message;
            }
        }
    </script>
</body>
</html>
